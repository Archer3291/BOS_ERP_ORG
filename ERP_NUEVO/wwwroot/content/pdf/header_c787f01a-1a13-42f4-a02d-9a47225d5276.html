<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: 'Segoe UI', Calibri, Arial, sans-serif;
            font-size: 11px;
            color: #1a1a1a;
            line-height: 1.3; /* bajar de 1.6 a 1.3 */
            letter-spacing: 0.5px;
            margin: 0;
            padding: 0;
        }

        .header-container {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-bottom: 3px solid #d32f2f;
            padding: 10px;
            margin-bottom: 2px;
            background: #fafafa;
        }

        .header-table {
            width: 100%;
            border-collapse: collapse;
        }

        .logo-cell {
            width: 18%;
            vertical-align: middle;
            padding-right: 8px;
            text-align: center;
        }

            .logo-cell img {
                width: 100px;
                max-height: 75px;
                display: block;
                margin: 0 auto;
                border-radius: 3px;
            }

        .emisor-cell {
            width: 50%;
            vertical-align: middle;
            padding: 0 10px;
            border-left: 2px solid #e0e0e0;
            border-right: 2px solid #e0e0e0;
        }

        .factura-cell {
            width: 32%;
            vertical-align: middle;
            padding: 8px 10px;
            background: #f5f5f5;
            border-radius: 3px;
        }

        .header-title {
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .factura-title {
            font-size: 12px;
            font-weight: bold;
            color: #1976d2;
            margin: 0 0 6px 0;
            text-align: right;
        }

        .emisor-info,
        .factura-info {
            font-size: 8px;
            line-height: 1.6;
        }

            .emisor-info div,
            .factura-info div {
                margin: 2px 0;
            }

            .emisor-info strong {
                color: #1976d2;
                font-weight: bold;
                display: inline-block;
                min-width: 85px;
            }

            .factura-info strong {
                color: #555;
                font-weight: bold;
                display: inline-block;
                min-width: 65px;
            }

        .uuid-highlight {
            background: white;
            padding: 4px 6px;
            border-radius: 2px;
            margin-top: 6px;
            font-size: 7.5px;
            word-break: break-all;
            border-left: 3px solid #1976d2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

            .uuid-highlight strong {
                color: #1976d2;
                min-width: auto;
            }
    </style>
</head>
<body>
    <div class="header-container">
        <table class="header-table">
            <tr>
                <!-- Logo -->
                <td class="logo-cell">
                    <img src="https://localhost:7167/content/img/SRS/logo.png" alt="Logo Empresa" />
                </td>

                <!-- Información del Emisor -->
                <td class="emisor-cell">
                        <div class="header-title">Factura CFDI 4.0</div>
                    <div class="emisor-info">
                        <div><strong>RFC:</strong> EKU9003173C9</div>
                        <div><strong>Razón Social:</strong> ESCUELA KEMPER URGATE</div>
                        <div><strong>Régimen Fiscal:</strong> 601 -- </div>
                        <div><strong>Dirección Fiscal:</strong> 42501</div>
                    </div>
                </td>

                <!-- Datos de la Factura -->
                <td class="factura-cell">
                    <div class="factura-info">
                        <div><strong>Fecha:</strong> 21/07/2026 12:32:29 p. m.</div>
                        <div><strong>Tipo:</strong> E</div>
                        <div><strong>Serie:</strong> NC</div>
                        <div><strong>Folio Interno:</strong> VIND-VIFAC-26-117</div>
                        <div><strong>Folio:</strong> VIND-VIFAC-26-117</div>
                    </div>
                    <div class="uuid-highlight">
                        <strong>Folio Fiscal:</strong> c787f01a-1a13-42f4-a02d-9a47225d5276
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
